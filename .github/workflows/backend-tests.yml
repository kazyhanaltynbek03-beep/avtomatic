name: Backend tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Kaspi integration tests
        run: pytest -q tests/test_kaspi_catalog_api.py tests/test_marketplace_cost_cards.py tests/test_connectors.py tests/test_production_financial_engine.py tests/test_accounting_invariants.py tests/test_migration_upgrade.py tests/test_canonical_marketplace.py::test_kaspi_window_pagination_and_merchant_sku 'tests/test_canonical_marketplace.py::test_user_golden_31000_all_sources[Kaspi]' 'tests/test_canonical_marketplace.py::test_confirmed_marketplace_return_reverses_existing_sale_once[Kaspi]' 'tests/test_canonical_marketplace.py::test_fx_revision_and_return_replay'
      - name: Full regression suite
        run: pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  postgres-upgrade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: qor
          POSTGRES_PASSWORD: qor-ci-only
          POSTGRES_DB: qor_migration_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qor -d qor_migration_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      QOR_POSTGRES_MIGRATION_URL: postgresql+psycopg://qor:qor-ci-only@localhost:5432/qor_migration_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r requirements.lock
      - name: Preserve existing PostgreSQL sales and returns during upgrade
        run: pytest -q tests/test_postgres_upgrade.py
