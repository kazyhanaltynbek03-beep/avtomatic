name: Backend tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Kaspi integration tests
        run: pytest -q tests/test_kaspi_catalog_api.py tests/test_marketplace_cost_cards.py
      - name: Full regression suite
        run: pytest -q
        continue-on-error: true
