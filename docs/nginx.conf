# Place behind your HTTPS configuration. Replace server_name and TLS paths.
server {
    listen 443 ssl;
    server_name erp.example.kz;
    ssl_certificate /etc/letsencrypt/live/erp.example.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.example.kz/privkey.pem;
    client_max_body_size 6m;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
    }
}
